<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tasuki app icon: a snow-capped volcano at dawn, crossed by the vermilion tasuki sash. Full bleed, so it
       also works as a maskable icon (everything that matters sits inside the central 80% circle). -->
